set default=0
# boot the first entry by itself after a few seconds (the theme shows a thin countdown bar)
set timeout=5

if [ x$feature_default_font_path = xy ] ; then
    font=unicode
else
    font=$prefix/unicode.pf2
fi

# Menu at the screen's own resolution (sharp, no mode switch before the boot splash): "auto" is the mode the firmware
# already uses, which is the panel's native one on a laptop. The old default was a fixed 800x600, which looks soft.
# "keep" hands the same mode to the kernel.
if loadfont $font ; then
    set gfxmode=auto
    set gfxpayload=keep
    insmod efi_gop
    insmod efi_uga
    insmod video_bochs
    insmod video_cirrus
else
    set gfxmode=auto
    insmod all_video
fi

insmod gfxterm
insmod png

# the theme's Inter fonts (grub-mkconfig does this for installed systems, live-build's menu does not)
loadfont /boot/grub/live-theme/inter-regular-20.pf2
loadfont /boot/grub/live-theme/inter-regular-24.pf2
loadfont /boot/grub/live-theme/inter-semibold-24.pf2

source /boot/grub/theme.cfg

terminal_output gfxterm
