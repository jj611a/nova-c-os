# Nova-C memory tuning. Swap is zram (compressed RAM, see /etc/default/zramswap), which is far faster than
# disk, so let the kernel use it early instead of dropping file cache (same values as Fedora/Pop!_OS).
vm.swappiness = 180
vm.page-cluster = 0
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
