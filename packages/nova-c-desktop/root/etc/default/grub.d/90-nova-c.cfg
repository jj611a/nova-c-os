# Nova-C OS: show the Nova-C boot splash (Plymouth) instead of kernel text.
# Debian's installer only sets "quiet"; add "splash" unless it is already there. Read by update-grub.
case " $GRUB_CMDLINE_LINUX_DEFAULT " in
	*" splash "*) ;;
	*) GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT splash" ;;
esac
GRUB_DISTRIBUTOR="Nova-C OS"
