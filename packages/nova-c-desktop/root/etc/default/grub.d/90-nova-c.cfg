# Nova-C OS boot menu and a quiet, quick boot. Read by update-grub (after /etc/default/grub).

# Boot splash (Plymouth) instead of kernel text, and nothing printed in between: Debian's installer only sets
# "quiet", so add the rest unless it is already there.
for _opt in splash loglevel=3 vt.global_cursor_default=0 nowatchdog; do
	case " $GRUB_CMDLINE_LINUX_DEFAULT " in
		*" $_opt "*) ;;
		*) GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT $_opt" ;;
	esac
done
unset _opt
GRUB_DISTRIBUTOR="Nova-C OS"

# Short menu (still there for dual boot), shown in the Nova-C theme at the screen's own resolution; the same mode
# is kept all the way to the boot splash, so there is no flicker between them.
GRUB_TIMEOUT=3
GRUB_TIMEOUT_STYLE=menu
GRUB_THEME=/usr/share/grub/themes/novac/theme.txt
GRUB_GFXMODE=auto
GRUB_GFXPAYLOAD_LINUX=keep
