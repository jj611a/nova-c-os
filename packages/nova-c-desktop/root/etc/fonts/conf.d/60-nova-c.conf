<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Nova-C OS: Inter is the default sans-serif and Fira Code the default monospace everywhere (browser, GTK and
     Qt apps). Inter has no Arabic or CJK glyphs: fontconfig falls back to the Noto fonts for those, per character. -->
<fontconfig>
  <alias binding="same"><family>sans-serif</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>monospace</family><prefer><family>Fira Code</family></prefer></alias>
</fontconfig>
